[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gandoki"
version = "1.0.0"
description = "Gandoki — precision-first secret & debug-exposure scanner that cannot lie to you."
authors = [{name = "Godwin Tarbo"}]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["security", "secrets", "secret-scanner", "mcp", "vibe-coding", "defender"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "httpx>=0.27", "pyyaml>=6.0", "mmh3>=4.1",
    "click>=8.1", "tldextract>=5.1", "tenacity>=8.2",
]

[project.optional-dependencies]
ct  = ["certstream>=1.12"]
mcp = ["mcp>=1.2,<2"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
gandoki     = "gandoki.cli:cli"
gandoki-mcp = "gandoki.mcp.server:main"

[project.urls]
Homepage   = "https://github.com/tarbo03/gandoki"
Repository = "https://github.com/tarbo03/gandoki"
Issues     = "https://github.com/tarbo03/gandoki/issues"

[tool.setuptools.packages.find]
include = ["gandoki*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
